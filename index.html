<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastPoll</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; /* Matches Facebook background color */
            font-family: Arial, sans-serif;
            overflow: hidden;
            /* Prevents annoying blue highlight blocks when tapping rapidly on mobile */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            text-align: center;
            max-width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .interactive-img {
            max-width: 100%;
            max-height: 90vh;
            height: auto;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: block;
            margin: 0 auto;
        }
        /* Gives the user physical feedback when they tap the image on a phone */
        .interactive-img[role="button"]:active {
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .counting-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.25);
            cursor: wait;
        }
        .counting-overlay[hidden] { display: none; }
        .counting-overlay img {
            display: block;
            width: min(900px, 85vw);
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
        }
    </style>
    
    <!-- CRITICAL: Preloads the second image so it swaps instantly without a white lag flash -->
    <link rel="preload" href="picture2.jpg" as="image">
    <link rel="preload" href="FastPoll-Counting-Votes(1).gif" as="image">
</head>
<body>

    <div class="container">
        <!-- Main display image -->
        <img id="displayImage" class="interactive-img" src="picture1.jpg" alt="FastPoll helicopter poll. Click to vote." role="button" tabindex="0">
    </div>

    <div id="countingOverlay" class="counting-overlay" role="status"
         aria-label="Counting votes. Please wait." hidden>
        <img src="FastPoll-Counting-Votes(1).gif" alt="Counting votes…">
    </div>

    <script>
        const displayImage = document.getElementById('displayImage');
        const overlay = document.getElementById('countingOverlay');
        let state = 'ready';

        function countVotes() {
            // Ignore additional clicks while counting and after results appear.
            if (state !== 'ready') return;
            state = 'counting';
            displayImage.setAttribute('aria-disabled', 'true');
            document.body.setAttribute('aria-busy', 'true');
            overlay.hidden = false;

            window.setTimeout(() => {
                displayImage.src = 'picture2.jpg';
                displayImage.alt = 'FastPoll voting results and confirmation.';
                displayImage.removeAttribute('role');
                displayImage.removeAttribute('tabindex');
                displayImage.removeAttribute('aria-disabled');
                displayImage.style.cursor = 'default';
                overlay.hidden = true;
                document.body.removeAttribute('aria-busy');
                state = 'results';
            }, 3000);
        }

        document.addEventListener('click', countVotes);
        displayImage.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                countVotes();
            }
        });
    </script>
</body>
</html>
