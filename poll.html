<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Interactive Image App</title>
    
    <!-- Connects to the Facebook Instant Games SDK -->
    <script src="https://facebook.net"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; /* Matches Facebook background color */
            font-family: Arial, sans-serif;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            text-align: center;
            max-width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .interactive-img {
            max-width: 100%;
            max-height: 90vh;
            height: auto;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: block;
            margin: 0 auto;
        }
        /* Mobile tap effect */
        .interactive-img:active {
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
    
    <!-- Preload the second image so it transitions instantly with zero lag -->
    <link rel="preload" href="picture2.jpg" as="image">
</head>
<body>

    <div class="container">
        <!-- Main display image -->
        <img id="gameImage" class="interactive-img" src="picture1.jpg" alt="Tap to interact" onclick="handleTap()">
    </div>

    <script>
        // Image filenames (must match your uploaded GitHub filenames exactly)
        const img1 = "picture1.jpg";
        const img2 = "picture2.jpg";

        // Initialize Facebook Instant Games SDK safely
        if (typeof FBInstant !== 'undefined') {
            FBInstant.initializeAsync().then(function() {
                // Starts the game loading sequence
                FBInstant.setLoadingProgress(100);
                return FBInstant.startGameAsync();
            }).then(function() {
                console.log("Facebook Instant Game successfully started.");
            }).catch(function(error) {
                console.log("SDK load skipped or error encountered (Normal if viewing outside FB):", error);
            });
        }

        // Logic to switch the images on tap/click
        function handleTap() {
            const imageElement = document.getElementById('gameImage');
            
            // Checks current source file name and toggles to the other
            if (imageElement.src.includes(img1)) {
                imageElement.src = img2;
            } else {
                imageElement.src = img1;
            }
        }
    </script>

</body>
</html>
